name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "chore/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret-key-9f4c4f268ea34ad0b0d105ca83758f92
      DJANGO_ALLOWED_HOSTS: testserver,localhost
      DJANGO_CORS_ALLOW_ALL_ORIGINS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check Django configuration and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yml
          python gunicorn.conf.py

      - name: Check hardened deployment configuration
        env:
          DATABASE_URL: "sqlite:///:memory:"
          CACHE_URL: "redis://localhost:6379/1"
          DJANGO_DEBUG: "false"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy

      - name: Run tests with coverage
        run: |
          python -m coverage run manage.py test
          python -m coverage report

      - name: Audit installed dependencies
        run: python -m pip_audit --local --strict

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-container-secret-9f4c4f268ea34ad0b0d105ca83758f92
      POSTGRES_PASSWORD: ci-only-database-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker compose build

      - name: Exercise production-shaped stack
        run: docker compose up --detach --no-build --wait --wait-timeout 120

      - name: Verify application response
        run: curl --fail --show-error http://127.0.0.1:8000/health/ready/

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop production-shaped stack
        if: always()
        run: docker compose down --volumes --remove-orphans
