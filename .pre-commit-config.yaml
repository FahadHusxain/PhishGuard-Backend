repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check --force-exclude
        language: system
        types: [python]

      - id: django-check
        name: Django system check
        entry: python manage.py check
        language: system
        pass_filenames: false
        types: [python]
