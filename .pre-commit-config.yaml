repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check --force-exclude
        language: system
        types: [python]

      - id: django-check
        name: Django system check
        entry: python manage.py check
        language: system
        pass_filenames: false
        types: [python]

      - id: repository-hygiene
        name: Repository hygiene
        entry: python scripts/check_repository.py
        language: system
        pass_filenames: false

      - id: reference-data
        name: Reference-data integrity
        entry: python scripts/check_reference_data.py
        language: system
        pass_filenames: false

      - id: browser-extension
        name: Browser-extension contract
        entry: python scripts/check_extension.py
        language: system
        pass_filenames: false
